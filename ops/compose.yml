# Secrets go in stack.env next to this file (keys in ops/stack.env.example).
#
# Run exactly one featherpage container: SQLite has a single writer, and a
# second one would also run the daily image cleanup and deploys twice.

services:
  featherpage:
    image: ghcr.io/feather-page/cms:latest
    restart: unless-stopped
    env_file:
      - stack.env
    volumes:
      # Database, images and build output, owned by uid 1000.
      - /web/data/featherpage/phoenix:/data
    networks:
      # The reverse proxy reaches the app as featherpage:4000.
      - frontend
      # The Ollama instance that suggests alt texts, descriptions and short post titles (OLLAMA_URL).
      - ollama

networks:
  frontend:
    external: true
  ollama:
    external: true
