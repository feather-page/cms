# Kamal 2 deployment of the Phoenix release (see Dockerfile and docs/cutover.md).
#
#   kamal deploy -d production
#
# Hosts and anything else server specific stay in config/deploy.production.yml
# (not in the repository), as for the Rails app.

service: meerkat

# Pushed as ghcr.io/feather-page/cms (Kamal prepends the registry server).
image: feather-page/cms

registry:
  server: ghcr.io
  username: shostakovich
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

servers:
  web:
    hosts:
      - 0.0.0.0

# One container, one SQLite writer: never run two app containers on the same
# volume. kamal-proxy waits for the health check before switching traffic.
proxy:
  app_port: 4000
  healthcheck:
    path: /up
    interval: 3
    timeout: 5

env:
  clear:
    PHX_HOST: app.feather.page
    DATABASE_PATH: /data/feather.db
    STORAGE_PATH: /data/storage
    # Caddy serves staging sites from /static/{host} (ops/Caddyfile).
    STAGING_SITES_PATH: /static
    POOL_SIZE: 5
  secret:
    - SECRET_KEY_BASE
    - CONFIG_ENCRYPTION_KEY
    - BASE_HOSTNAME_AND_PORT
    - SMTP_ADDRESS
    - SMTP_PORT
    - SMTP_USERNAME
    - SMTP_PASSWORD
    - UNSPLASH_ACCESS_KEY

volumes:
  # Database (feather.db) and image storage. Back this up.
  - feather_data:/data
  # The host directory Caddy serves as /static; must be the same directory
  # the Rails container wrote staging sites to (check deploy.production.yml).
  # The container runs as uid 1000, which needs write access here.
  - /static:/static
