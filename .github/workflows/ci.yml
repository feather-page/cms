name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rclone

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp28-elixir1.19-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-otp28-elixir1.19-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      - name: Run tests
        run: mix test

  assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-assets-${{ runner.os }}-otp28-elixir1.19-${{ hashFiles('mix.lock') }}
          restore-keys: mix-assets-${{ runner.os }}-otp28-elixir1.19-

      - name: Install dependencies
        run: mix deps.get

      - name: Build assets
        run: mix assets.setup && mix assets.deploy
