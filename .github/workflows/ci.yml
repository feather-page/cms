name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rclone

      - name: Install d2 (the version of the Dockerfile)
        run: |
          version=$(sed -n 's|^FROM .*d2lang/d2:\(v[0-9.]*\)@.*|\1|p' Dockerfile)
          test -n "$version"
          curl -fsSL "https://github.com/terrastruct/d2/releases/download/$version/d2-$version-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/d2-$version/bin/d2" /usr/local/bin/d2
          d2 --version

      - name: Install chroma (the version of the Dockerfile)
        run: |
          version=$(sed -n 's|^ARG CHROMA_VERSION=\([0-9.]*\)$|\1|p' Dockerfile)
          test -n "$version"
          curl -fsSL "https://github.com/alecthomas/chroma/releases/download/v$version/chroma-$version-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" chroma
          sudo install -m 755 "$RUNNER_TEMP/chroma" /usr/local/bin/chroma
          chroma --version

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp28-elixir1.19-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-otp28-elixir1.19-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run Credo
        run: mix credo --strict

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      - name: Run tests
        run: mix test

  assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-assets-${{ runner.os }}-otp28-elixir1.19-${{ hashFiles('mix.lock') }}
          restore-keys: mix-assets-${{ runner.os }}-otp28-elixir1.19-

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Install dependencies
        run: mix deps.get

      - name: Build assets
        run: mix assets.setup && mix assets.deploy

  # The release image for ops/compose.yml, only for main and only when the
  # other jobs pass. Watchtower on the server pulls :latest at night.
  image:
    needs: [test, assets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
